name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Godot and Export Templates
      run: |
        # Scarica l'editor di Godot per macOS
        curl -L -o Godot.zip https://github.com
        unzip Godot.zip
        mv Godot.app /Applications/Godot.app

        # Crea la cartella ufficiale dei template di Godot su macOS
        mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.6.stable
        
        # Scarica i template ufficiali e li posiziona dove l'editor li aspetta
        curl -L -o ~/Library/Application\ Support/Godot/export_templates/4.6.stable/ios.zip https://github.com

    - name: Set up Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Restore Frameworks via Godot
      run: |
        # Forza Godot a rigenerare la cartella .xcframework mancante usando i template ufficiali appena scaricati
        mkdir -p "pst1 (mobile test ios).xcframework"
        unzip -j ~/Library/Application\ Support/Godot/export_templates/4.6.stable/ios.zip "ios_xcode/godot.xcframework/*" -d "pst1 (mobile test ios).xcframework/" || true
        
        # Se il comando sopra fallisce per via delle sottocartelle, estraiamo l'intero pacchetto e copiamo i file strutturati
        unzip ~/Library/Application\ Support/Godot/export_templates/4.6.stable/ios.zip -d godot_templt_extracted
        cp -r godot_templt_extracted/ios_xcode/godot.xcframework/* "pst1 (mobile test ios).xcframework/" || true
        rm -rf godot_templt_extracted

    - name: Build Xcode Project
      run: |
        xcodebuild -project "pst1 (mobile test ios).xcodeproj" \
                   -scheme "pst1 (mobile test ios)" \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        mv build/Release-iphoneos/*.app Payload/ 2>/dev/null || mv build/ios/build/Release-iphoneos/*.app Payload/ 2>/dev/null || mv ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
        zip -r gioco_ios.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-game-ipa
        path: gioco_ios.ipa
