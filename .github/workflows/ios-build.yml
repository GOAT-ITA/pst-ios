name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and Restore Godot XCFrameworks
      run: |
        # Crea la cartella per la libreria mancante
        mkdir -p "pst1 (mobile test ios).xcframework"
        
        # Scarica direttamente la libreria statica di Godot ufficiale da una repository di release specchio o curl mirato
        # Per massima stabilità, scarichiamo l'eseguibile precompilato ufficiale da GitHub Releases
        curl -L -o godot_ios.zip https://github.com
        
        # Usiamo python, già integrato nel Mac di GitHub, che estrae i file zip / tpz senza fare storie sul formato
        python3 -c "import zipfile; zipfile.ZipFile('godot_ios.zip').extractall('templates_extracted')"
        
        # Estrae il sotto-archivio di iOS sempre usando python
        python3 -c "import zipfile; zipfile.ZipFile('templates_extracted/templates/ios.zip').extractall('ios_extracted')"
        
        # Sposta i file della libreria dentro il tuo progetto Xcode
        cp -r ios_extracted/ios_xcode/godot.xcframework/* "pst1 (mobile test ios).xcframework/"
        
        # Pulisce i file temporanei
        rm -rf godot_ios.zip templates_extracted ios_extracted

    - name: Set up Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Xcode Project
      run: |
        xcodebuild -project "pst1 (mobile test ios).xcodeproj" \
                   -scheme "pst1 (mobile test ios)" \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        mv build/Release-iphoneos/*.app Payload/ 2>/dev/null || mv build/ios/build/Release-iphoneos/*.app Payload/ 2>/dev/null || mv ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
        zip -r gioco_ios.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-game-ipa
        path: gioco_ios.ipa
